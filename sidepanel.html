<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Chrome</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="app">
    <header id="header" role="banner">
      <div class="header-left">
        <div class="brand">
          <svg class="brand-mark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2v20"/>
            <path d="M2 12h20"/>
            <circle cx="12" cy="12" r="3.5"/>
            <path d="M5.6 5.6l12.8 12.8"/>
            <path d="M18.4 5.6L5.6 18.4"/>
          </svg>
          <span class="brand-name">Hermes</span>
        </div>
      </div>
      <div class="header-right">
        <span id="connection-status" class="status-dot" title="Connecting..." aria-label="Connection status"></span>
        <button id="btn-clear" type="button" class="icon-btn" title="Clear conversation" aria-label="Clear conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
        <button id="btn-settings" type="button" class="icon-btn" title="Settings" aria-label="Open settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <div id="connection-banner" class="connection-banner hidden" role="status" aria-live="polite">
      <div class="banner-icon" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <div class="banner-text" id="banner-text">Not connected</div>
      <div class="banner-actions">
        <button id="btn-redetect" type="button" class="banner-btn">Re-detect</button>
        <button id="btn-open-settings" type="button" class="banner-btn banner-btn-primary">Settings</button>
      </div>
    </div>

    <main id="messages" class="messages" role="log" aria-live="polite" aria-label="Conversation">
      <section id="welcome" class="welcome">
        <div class="welcome-mark" aria-hidden="true">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M2 12h20"/><circle cx="12" cy="12" r="3.5"/><path d="M5.6 5.6l12.8 12.8"/><path d="M18.4 5.6L5.6 18.4"/></svg>
        </div>
        <h2>Hermes Agent</h2>
        <p>Chat with your local AI. All data stays on your machine.</p>
        <div class="quick-actions" role="list">
          <button class="quick-btn" type="button" data-msg="What can you help me with?" role="listitem">
            <span class="quick-btn-title">What can you do?</span>
            <span class="quick-btn-hint">Quick overview of capabilities</span>
          </button>
          <button class="quick-btn" type="button" data-msg="Summarize this page" role="listitem">
            <span class="quick-btn-title">Summarize this page</span>
            <span class="quick-btn-hint">Pulls in title, URL, and visible text</span>
          </button>
          <button class="quick-btn" type="button" data-msg="Show me the current system status" role="listitem">
            <span class="quick-btn-title">System status</span>
            <span class="quick-btn-hint">Gateway health and runtime config</span>
          </button>
        </div>
      </section>
    </main>

    <footer id="input-area">
      <div id="page-context-bar" class="page-context-bar hidden">
        <span class="page-context-icon" aria-hidden="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/><path d="M3 12h18"/><path d="M12 3a14.5 14.5 0 0 1 0 18"/><path d="M12 3a14.5 14.5 0 0 0 0 18"/></svg>
        </span>
        <span class="page-context-label">Page context off</span>
        <button id="btn-toggle-context" type="button" class="toggle-btn" aria-pressed="false">Off</button>
      </div>
      <div class="input-row">
        <textarea id="user-input" placeholder="Ask Hermes anything..." rows="1" aria-label="Message Hermes"></textarea>
        <button id="btn-send" type="button" disabled title="Send (Enter)" aria-label="Send message">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <p class="input-hint">Press <kbd>/</kbd> for commands, <kbd>↑</kbd> history after first message</p>
    </footer>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
